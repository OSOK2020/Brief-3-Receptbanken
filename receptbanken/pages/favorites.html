<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptboken</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/mainStyle.css">
    <link rel="stylesheet" href="../css/detailView.css">

    <!-- Scripts -->
    <script type="module" src="../js/favorites.js" defer></script>
    <script type="module" src="../js/search.js" defer></script>
    <script type="module" src="../js/filter.js" defer></script>
    <script type="module" src="../js/detailView.js" defer></script>
</head>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Receptbanken</h1>
            <p>Hitta dina favoritrecept</p>
        </div>
        <nav id="navigation">
            <a href="../index.html">Hem</a>
            <a href="favorites.html">Mina favoritrecept</a>
    </header>
    <main>
        <!---sök/filter kommer senare-->
        <section class="filteringSection">
            <section class="search-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Sök recept...">
            </section>
            <!-- <section class="filter-section"> -->
            <p id="categories-filter">Kategorier</p>
            <div id="filter-header">

                <div id="kategorier">
                    <button class="filter-knapp" data-kategori="alla">Alla recept</button>
                    <button class="filter-knapp" data-kategori="pasta">Pasta</button>
                    <button class="filter-knapp" data-kategori="soppa">Soppa</button>
                    <button class="filter-knapp" data-kategori="gryta">Gryta</button>
                    <button class="filter-knapp" data-kategori="sallad">Sallad</button>
                </div>
            </div>
            <!-- </section> -->
        </section>
        
        <!--Tom listbehållare-->
        <ul id="recipe-list"></ul>

    </main>
    <footer>
        <p>&copy;Grupp 3C, WEBB26 </p>
    </footer>
</body>
</html>
